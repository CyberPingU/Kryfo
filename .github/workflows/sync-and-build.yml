name: Sync Upstream & Build Dreadful

on:
  push:
    branches:
      - main
  schedule:
    # Run once a day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Upstream tag to build (e.g. v0.6.3, leave empty for latest upstream tag)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if release already exists'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-and-build:
    name: Sync, Patch and Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/GnosiWorks/Kryfo.git || true
          git fetch upstream --tags

      - name: Determine upstream version
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_tag }}" ]; then
            TAG="${{ github.event.inputs.target_tag }}"
          else
            TAG=$(git tag -l --sort=-v:refname "v*" | grep -E '^v[0-9]' | head -n1)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          RELEASE_TAG="${TAG}-dreadful"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Target tag: $TAG -> Release: $RELEASE_TAG"

      - name: Check if release already exists
        id: check_release
        run: |
          if [ "${{ github.event.inputs.force_build }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if gh release view "${{ steps.target.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.target.outputs.release_tag }} already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release ${{ steps.target.outputs.release_tag }} does not exist. Proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare patched source
        if: steps.check_release.outputs.should_build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.DREADFUL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DREADFUL_KEY_PASSWORD }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          echo "Staging patch and build script..."
          mkdir -p /tmp/dreadful-assets
          cp patches/0001-vault-onboarding-plausible-absence.patch /tmp/dreadful-assets/
          cp packaging/build-dreadful-apk.sh /tmp/dreadful-assets/

          echo "Checking out $TAG..."
          git checkout "$TAG"

          echo "Restoring build script..."
          mkdir -p packaging
          cp /tmp/dreadful-assets/build-dreadful-apk.sh packaging/
          chmod +x packaging/build-dreadful-apk.sh

          echo "Applying vault onboarding patch..."
          git apply /tmp/dreadful-assets/0001-vault-onboarding-plausible-absence.patch

          echo "Configuring package work.dreadful.kryfo..."
          sed -i 's|applicationId = "app.kryfo"|applicationId = "work.dreadful.kryfo"|' \
            mobile/android/app/build.gradle.kts
          sed -i 's|appId.get() == "app.kryfo.bridgetest"|appId.get() == "app.kryfo.bridgetest" \|\| appId.get().endsWith(".bridgetest")|' \
            mobile/android/app/build.gradle.kts
          sed -i 's|<color name="ic_launcher_seal">#E58A2B</color>|<color name="ic_launcher_seal">#1E6B8A</color>|' \
            mobile/android/app/src/main/res/values/colors.xml

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Setting up release signing keystore from secret..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > mobile/android/app/dreadful.keystore
            cp mobile/android/app/dreadful.keystore mobile/android/dreadful.keystore
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=dreadful\nstoreFile=dreadful.keystore\n" \
              "$KEYSTORE_PASSWORD" \
              "$KEYSTORE_PASSWORD" > mobile/android/key.properties
            echo "Release keystore configured successfully."
          fi

      - name: Cache native jniLibs
        if: steps.check_release.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: mobile/android/app/src/main/jniLibs
          key: jni-libs-${{ hashFiles('engine/**', 'mobile/native/kryfo_signal/**') }}

      - name: Set up Docker Buildx
        if: steps.check_release.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Repro Toolchain Image
        if: steps.check_release.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: repro
          load: true
          tags: kryfo-repro:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fix workspace permissions
        if: steps.check_release.outputs.should_build == 'true'
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Run Build in reproducible container
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          docker run --rm \
            --ulimit nofile=65536:65536 \
            -v "$GITHUB_WORKSPACE:/home/vagrant/build/app.kryfo" \
            -w /home/vagrant/build/app.kryfo \
            -e HOME=/home/vagrant \
            --entrypoint /bin/bash \
            kryfo-repro:latest \
            packaging/build-dreadful-apk.sh

      - name: Prepare release assets
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          RELEASE_APK="mobile/build/app/outputs/flutter-apk/app-foss-release.apk"
          DEST_NAME="Kryfo-Dreadful-${{ steps.target.outputs.tag }}.apk"
          cp "$RELEASE_APK" "$DEST_NAME"
          sha256sum "$DEST_NAME" > "${DEST_NAME}.sha256"

      - name: Create GitHub Release
        if: steps.check_release.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.release_tag }}
          name: "Kryfo Dreadful ${{ steps.target.outputs.tag }}"
          body: |
            ### Kryfo Dreadful (${{ steps.target.outputs.tag }})

            Downstream hardened build of [Kryfo](https://github.com/GnosiWorks/Kryfo) based on upstream `${{ steps.target.outputs.tag }}`.

            > [!IMPORTANT]
            > **Please support and use the official Kryfo app by Marios (GnosiWorks) at [kryfo.app](https://kryfo.app)!**

            #### Changes in this build:
            - **Application ID**: `work.dreadful.kryfo` (installs cleanly alongside official Kryfo without conflict).
            - **Vault Setup during Onboarding**: Configurable at first start with strict plausible absence (no trace in everyday settings; skipping is irreversible).
            - **Coercion Resistance**: Dual PIN setup (everyday PIN + hidden chats PIN) explained upfront.
            - **FOSS Flavor**: Completely tracker-free, zero Google/FCM dependencies (Tor always-on / UnifiedPush ntfy).
          files: |
            Kryfo-Dreadful-${{ steps.target.outputs.tag }}.apk
            Kryfo-Dreadful-${{ steps.target.outputs.tag }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
