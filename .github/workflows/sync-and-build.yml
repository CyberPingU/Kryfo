name: Sync Upstream & Build Dreadful

on:
  push:
    branches:
      - main
  schedule:
    # Check upstream every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Upstream tag to build (e.g. v0.6.3, leave empty for latest upstream tag)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if release already exists'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-and-build:
    name: Sync, Patch and Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/GnosiWorks/Kryfo.git || true
          git fetch upstream --tags

      - name: Determine upstream version
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_tag }}" ]; then
            TAG="${{ github.event.inputs.target_tag }}"
          else
            TAG=$(git tag -l --sort=-v:refname "v*" | grep -E '^v[0-9]+(\.[0-9]+)+$' | head -n1)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          RELEASE_TAG="${TAG}-dreadful"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Target tag: $TAG -> Release: $RELEASE_TAG"

      - name: Check if release already exists
        id: check_release
        run: |
          if [ "${{ github.event.inputs.force_build }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.target.outputs.release_tag }}")
          echo "GitHub Releases API returned status $HTTP_STATUS for tag ${{ steps.target.outputs.release_tag }}"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Release ${{ steps.target.outputs.release_tag }} already exists on ${{ github.repository }}. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release ${{ steps.target.outputs.release_tag }} does not exist on ${{ github.repository }}. Proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare patched source
        if: steps.check_release.outputs.should_build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.DREADFUL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DREADFUL_KEY_PASSWORD }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          echo "Staging patches and build script..."
          mkdir -p /tmp/dreadful-assets
          cp patches/*.patch /tmp/dreadful-assets/
          cp packaging/build-dreadful-apk.sh /tmp/dreadful-assets/

          echo "Checking out $TAG..."
          git checkout "$TAG"

          echo "Restoring build script..."
          mkdir -p packaging
          cp /tmp/dreadful-assets/build-dreadful-apk.sh packaging/
          chmod +x packaging/build-dreadful-apk.sh

          echo "Applying patches..."
          for p in /tmp/dreadful-assets/*.patch; do
            echo "Applying $p..."
            git apply "$p"
          done

          echo "Configuring package work.dreadful.kryfo..."
          sed -i 's|applicationId = "app.kryfo"|applicationId = "work.dreadful.kryfo"|' \
            mobile/android/app/build.gradle.kts
          sed -i 's|appId.get() == "app.kryfo.bridgetest"|appId.get() == "app.kryfo.bridgetest" \|\| appId.get().endsWith(".bridgetest")|' \
            mobile/android/app/build.gradle.kts
          sed -i 's|<color name="ic_launcher_seal">#E58A2B</color>|<color name="ic_launcher_seal">#1E6B8A</color>|' \
            mobile/android/app/src/main/res/values/colors.xml

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Setting up release signing keystore from secret..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > mobile/android/app/dreadful.keystore
            cp mobile/android/app/dreadful.keystore mobile/android/dreadful.keystore
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=dreadful\nstoreFile=dreadful.keystore\n" \
              "$KEYSTORE_PASSWORD" \
              "$KEYSTORE_PASSWORD" > mobile/android/key.properties
            echo "Release keystore configured successfully."
          fi

      - name: Cache native jniLibs
        if: steps.check_release.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: mobile/android/app/src/main/jniLibs
          key: jni-libs-${{ hashFiles('engine/**', 'mobile/native/kryfo_signal/**') }}

      - name: Set up Docker Buildx
        if: steps.check_release.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Repro Toolchain Image
        if: steps.check_release.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: repro
          load: true
          tags: kryfo-repro:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inject Google Services configuration
        if: steps.check_release.outputs.should_build == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Injecting Google Services configuration for Play flavor..."
            mkdir -p mobile/android/app/src/play
            echo "$GOOGLE_SERVICES_JSON" > mobile/android/app/src/play/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not set, will build FOSS flavor only."
          fi

      - name: Fix workspace permissions
        if: steps.check_release.outputs.should_build == 'true'
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Run Build in reproducible container
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          docker run --rm \
            --ulimit nofile=65536:65536 \
            -v "$GITHUB_WORKSPACE:/home/vagrant/build/app.kryfo" \
            -w /home/vagrant/build/app.kryfo \
            -e HOME=/home/vagrant \
            --entrypoint /bin/bash \
            kryfo-repro:latest \
            packaging/build-dreadful-apk.sh

      - name: Prepare release assets
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          FOSS_APK="mobile/build/app/outputs/flutter-apk/app-foss-release.apk"
          DEST_FOSS="Kryfo-Dreadful-${{ steps.target.outputs.tag }}-foss.apk"
          cp "$FOSS_APK" "$DEST_FOSS"
          cp "$FOSS_APK" "Kryfo-Dreadful-${{ steps.target.outputs.tag }}.apk"
          sha256sum "$DEST_FOSS" > "${DEST_FOSS}.sha256"
          sha256sum "Kryfo-Dreadful-${{ steps.target.outputs.tag }}.apk" > "Kryfo-Dreadful-${{ steps.target.outputs.tag }}.apk.sha256"

          PLAY_APK="mobile/build/app/outputs/flutter-apk/app-play-release.apk"
          if [[ -f "$PLAY_APK" ]]; then
            DEST_PLAY="Kryfo-Dreadful-${{ steps.target.outputs.tag }}-play.apk"
            cp "$PLAY_APK" "$DEST_PLAY"
            sha256sum "$DEST_PLAY" > "${DEST_PLAY}.sha256"
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.release_tag }}
          name: "Kryfo Dreadful ${{ steps.target.outputs.tag }}"
          body: |
            ### Kryfo Dreadful (${{ steps.target.outputs.tag }})

            Hardened private fork of Kryfo based on upstream `${{ steps.target.outputs.tag }}`.

            #### Features & Hardening:
            - **Application ID**: `work.dreadful.kryfo` (installs cleanly alongside official Kryfo without conflict).
            - **Vault Setup during Onboarding & Restore**: Configurable at first start or profile restore with strict plausible absence (no trace in everyday settings; skipping is irreversible).
            - **Coercion Resistance**: Mandatory App PIN on onboarding and restore + optional hidden chats PIN.
            - **Clean Slate**: Removed developer default contact, upstream support/social links, and repointed source code links to this repository.
            - **Dual Flavors**:
              - **FOSS (`-foss.apk` / default)**: Completely tracker-free, zero Google/FCM dependencies (Tor always-on or UnifiedPush ntfy).
              - **Play (`-play.apk`)**: Native Google Play Services Push (FCM wake-up ping via `r.dreadful.work` gateway) without any companion app needed.
          files: |
            Kryfo-Dreadful-*.apk
            Kryfo-Dreadful-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
