release_filter: '^v[0-9]+\.[0-9]+\.[0-9]+-dreadful$'
match: '.*-arm64-v8a-foss\.apk$'

name: H-Kryfo
summary: Hardened experimental fork of Kryfo for P2P messaging over Tor with PQXDH
description: |
  **H-Kryfo** (Hardened Kryfo) is an experimental, hardened, and unofficial fork of **Kryfo**, the private messaging client designed and developed by **Marios** ([GnosiWorks](https://github.com/GnosiWorks/Kryfo) / [kryfo.app](https://kryfo.app)).

  This downstream release introduces targeted measures for coercion resistance, plausible deniability of isolated archives (vault), forensic state uniformity, and autonomous push notification infrastructure:
  - completely anonymous routing via an embedded Tor onion daemon (with support for WebTunnel and obfs4 bridges);
  - post-quantum end-to-end encryption based on PQXDH and Double Ratchet;
  - locally generated three-word identifier, requiring no phone number, email address, or central account;
  - isolated archive (vault) with a dedicated PIN and automated uniform vault sealing for plausible deniability;
  - asynchronous push notifications via UnifiedPush (UP-Tor bridge and custom ntfy server);
  - zero-drop push delivery: continuous instant push registration by default (with an opt-in toggle in settings to re-enable upstream rest rotation; vault chats remain strictly excluded);
  - hardened background execution: background JobService timeout shortened from 170s to 35s to prevent Android 14/15 JobScheduler ANRs and wakelock leaks;
  - pure FOSS build, entirely free of Google Play Services and tracking libraries (if you prefer native FCM wake-up push, the `-play.apk` variant is downloadable directly from GitHub Releases via Obtainium);
  - independent Application ID (`work.dreadful.kryfo`) allowing side-by-side installation alongside official Kryfo without conflict.

  ---
  *Official upstream project*: if you wish to use the reference version or support the primary author Marios, visit [kryfo.app](https://kryfo.app) and the [GnosiWorks/Kryfo](https://github.com/GnosiWorks/Kryfo) repository.
license: GPL-3.0-or-later
